<!-- notes/templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sticky Notes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}" />
</head>
<body>
    <header>
        <h1><a href="{% url 'notes:note_list' %}">📌 Sticky Notes</a></h1>
        <nav>
            <a href="{% url 'notes:note_list' %}">Home</a>
            <a href="{% url 'notes:note_create' %}">New Note</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Sticky Notes App</p>
    </footer>
</body>
</html>
